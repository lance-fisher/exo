user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # --- Basic settings ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # --- Rate limiting zones ---
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_approval:10m rate=10r/s;

    # --- Connection limiting ---
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --- Upstream broker ---
    upstream broker {
        server broker:3100;
        keepalive 32;
    }

    # --- HTTP: redirect to HTTPS ---
    server {
        listen 80;
        listen [::]:80;
        server_name ops.lancewfisher.com;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: main server ---
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ops.lancewfisher.com;

        # --- TLS Configuration ---
        ssl_certificate /etc/letsencrypt/live/ops.lancewfisher.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ops.lancewfisher.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/ops.lancewfisher.com/chain.pem;

        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # --- mTLS for agent WebSocket endpoint ---
        # Agent connections require client certificate verification
        # The CA cert that signed agent certificates
        ssl_client_certificate /etc/sovereign/certs/agent-ca.pem;
        ssl_verify_client optional;

        # --- Security Headers ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://ops.lancewfisher.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # --- Connection limits ---
        limit_conn conn_limit 20;

        # --- Health check (no rate limit) ---
        location = /api/system/health {
            proxy_pass http://broker;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Auth endpoints (strict rate limit) ---
        location /api/auth/ {
            limit_req zone=api_auth burst=10 nodelay;

            proxy_pass http://broker;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # --- Approval endpoints (moderate rate limit) ---
        location /api/approval/ {
            limit_req zone=api_approval burst=5 nodelay;

            proxy_pass http://broker;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # --- SSE streaming (extended timeouts) ---
        location ~ ^/api/tasks/[^/]+/stream$ {
            proxy_pass http://broker;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --- Agent WebSocket (mTLS required) ---
        location /ws/agent {
            # Require valid client certificate for agent connections
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            proxy_pass http://broker;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass client certificate fingerprint to broker
            proxy_set_header X-Client-Cert-Fingerprint $ssl_client_fingerprint;
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;

            # WebSocket timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- General API (standard rate limit) ---
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass http://broker;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # --- Block everything else ---
        location / {
            return 404;
        }
    }
}
